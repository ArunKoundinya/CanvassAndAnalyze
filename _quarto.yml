project:
  type: website
  resources:
    - "audio/*.mp3"
    - "5888dbbfcade0a44b6f08032a83338de.txt"
  post-render:
    - scripts/seo.py
    - scripts/series_nav.py
    - scripts/audio_player.py

website:
  title: "Canvass And Analyze"
  site-url: https://arunkoundinya.github.io/CanvassAndAnalyze/
  description: "My thought process on confluence of Psychology, Analytics and Management."
  favicon: "/images/favicon.png"
  open-graph: true
  twitter-card: true
  image: /images/social-card.png
  # Analytics (needed for a real "Popular" section). Uncomment once you
  # have a Google Analytics ID, or swap for GoatCounter/Plausible in include-in-header.
  # google-analytics: "G-XXXXXXXXXX"
  navbar:
    logo: /images/logo-mark.svg
    left:
      - text: Home
        href: index.qmd
      - text: Series
        menu:
          - text: "Threads of One Life (novel)"
            href: series/novel.qmd
          - text: Thinking in Systems
            href: series/systems.qmd
          - text: Extended Learnings on Indian Culture
            href: series/spirituality.qmd
          - text: COVID-19 Chronicles
            href: series/covid19.qmd
      - text: All essays
        href: archive.qmd
      - about.qmd
    right:
      - icon: rss
        href: index.xml
      - icon: github
        href: https://github.com/ArunKoundinya
      - icon: linkedin
        href: https://www.linkedin.com/in/arunkoundinya0710/

  page-footer:
    right: "Built with 💛 and [Quarto](https://quarto.org/)."
    left: "&copy; 2017 – 2026 [Arun Koundinya Parasa](https://arunkoundinya.github.io/) · Also: [Tidy Tuesday](https://arunkoundinya.github.io/TidyTuesday/) · [AI Basics with AK](https://arunkoundinya.github.io/AIBasicswithAK/) · [Deep Learning](https://arunkoundinya.github.io/DeepLearning/)"

format:
